[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "corpus-mesh"
version = "0.1.0"
description = "Experimental long-horizon AI reliability architecture"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
corpus-mesh-benchmark = "corpus_mesh.benchmark:main"

[tool.setuptools.packages.find]
include = ["corpus_mesh*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
